name: itemnest

services:
  itemnest-api:
    image: ${IMAGE_NAME}
    container_name: itemnest-api
    restart: unless-stopped
    depends_on:
      - sqlserver
    ports:
      - "${APP_HTTP_PORT:-80}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS:-true}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_DATABASE:-ItemNestDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-ItemNestAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-ItemNestClient}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
      Aws__AccessKeyId: ${AWS_ACCESS_KEY_ID:-}
      Aws__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY:-}
      Aws__AccountId: ${AWS_ACCOUNT_ID:-}
      Aws__BucketName: ${AWS_BUCKET_NAME:-}
      Aws__PublicUrl: ${AWS_PUBLIC_URL:-}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
      AdminSeed__FullName: ${ADMIN_SEED_FULLNAME:-}

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: itemnest-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - itemnest-sqlserver-data:/var/opt/mssql

volumes:
  itemnest-sqlserver-data:
