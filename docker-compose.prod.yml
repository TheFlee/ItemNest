name: itemnest

services:
  itemnest-api:
    image: ${IMAGE_NAME}
    container_name: itemnest-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-80}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS:-true}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ItemNestDb};Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-ItemNestAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-ItemNestClient}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
      Aws__AccessKeyId: ${AWS_ACCESS_KEY_ID:-}
      Aws__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY:-}
      Aws__AccountId: ${AWS_ACCOUNT_ID:-}
      Aws__BucketName: ${AWS_BUCKET_NAME:-}
      Aws__PublicUrl: ${AWS_PUBLIC_URL:-}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
      AdminSeed__FullName: ${ADMIN_SEED_FULLNAME:-}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-https://localhost:5173}

  postgres:
    image: postgres:17-alpine
    container_name: itemnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ItemNestDb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - itemnest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  itemnest-postgres-data:
