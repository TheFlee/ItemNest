name: Docker CI/CD

on:
  push:
    branches:
      - main
      - docker
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/itemnest

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to Amazon Linux
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/itemnest_ec2
          chmod 600 ~/.ssh/itemnest_ec2
          ssh-keyscan -p "$EC2_PORT" "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Create production environment file
        run: |
          cat > itemnest.production.env <<'EOF'
          IMAGE_NAME=${{ env.DOCKER_IMAGE }}:latest
          APP_HTTP_PORT=80
          DATABASE_APPLY_MIGRATIONS=true
          MSSQL_DATABASE=ItemNestDb
          MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}
          JWT_KEY=${{ secrets.JWT_KEY }}
          JWT_ISSUER=ItemNestAPI
          JWT_AUDIENCE=ItemNestClient
          JWT_EXPIRY_MINUTES=60
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
          EOF

      - name: Upload compose files
        run: |
          ssh -i ~/.ssh/itemnest_ec2 -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" "sudo mkdir -p /opt/itemnest && sudo chown -R $EC2_USER:$EC2_USER /opt/itemnest"
          scp -i ~/.ssh/itemnest_ec2 -P "$EC2_PORT" docker-compose.prod.yml "$EC2_USER@$EC2_HOST:/opt/itemnest/docker-compose.prod.yml"
          scp -i ~/.ssh/itemnest_ec2 -P "$EC2_PORT" itemnest.production.env "$EC2_USER@$EC2_HOST:/opt/itemnest/.env"

      - name: Pull and restart containers
        run: |
          ssh -i ~/.ssh/itemnest_ec2 -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" "printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin"
          ssh -i ~/.ssh/itemnest_ec2 -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" "cd /opt/itemnest && docker compose --env-file .env -f docker-compose.prod.yml pull && docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans && docker image prune -f"
